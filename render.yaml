# Postgres-native deployment blueprint (migration-plan Phase 6).
#
# REFERENCE-ONLY (Phase 7 / owner decisions): the deploy target is AWS ECS
# ap-southeast-2 with the database tier on Supabase Sydney (2026-08-13) —
# see docs/aws-deployment-plan.md. Delete this file once ECS is proven (B6).
# If it is ever revived: DATABASE_URL/CONTROL_DATABASE_URL are now the
# Supabase transaction-pooler URLs and DIRECT_URL/CONTROL_DIRECT_URL
# (session pooler) must be added for the pre-deploy migrate step.
#
# NOTE (Phase 7): Render has NO Australian region — this blueprint deploys app
# compute only; the databases MUST live in an AU region. This file
# intentionally no longer matches the original repo's live service.
services:
  - type: web
    name: aequilibri-postgres
    runtime: node
    region: singapore # nearest to AU on Render; see the Phase 7 note above
    plan: free
    # --include=dev → NODE_ENV=production makes npm skip devDependencies, but
    # the build toolchain (prisma CLI, typescript, tailwind) lives there.
    # BOTH Prisma clients are generated (tenant + control, §2b split).
    # Migrations are applied by the release phase against BOTH databases via
    # scripts/migrate-all-tenants.mjs (control DB → default tenant DB → every
    # provisioned per-org tenant DB).
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: node scripts/migrate-all-tenants.mjs
    startCommand: npm start
    healthCheckPath: /api/health
    # HARD CONSTRAINT: the caches, proposal claim and scheduler lock are
    # per-process (no shared Redis). Do NOT raise until that exists.
    numInstances: 1

    envVars:
      # ── Data layer (§2b: one control DB + tenant DBs) ──────────────────────
      # DATABASE_URL         → the default/shared tenant database.
      # CONTROL_DATABASE_URL → the control-plane database (org registry, team,
      #                        RLS assignments, connections, outbox, catalogs).
      # Per-org tenant databases are provisioned by scripts/provision-tenant-db.mjs
      # and routed via the registry (settings.tenantDatabaseUrl) — no env needed.
      - key: DATABASE_URL
        sync: false
      - key: CONTROL_DATABASE_URL
        sync: false
      # Per-org tenant client cache cap (see lib/db.ts; default 8).
      - key: TENANT_CLIENT_CAP
        value: "8"

      # ── AI (required for live responses; omit for demo mode) ───────────────
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Auth (Clerk) ────────────────────────────────────────────────────────
      # The platform FAILS CLOSED without these: /app/* returns 503 unless
      # ALLOW_DEMO_MODE=true is set. Production runs with Clerk auth ON, so both
      # keys MUST be set (pk_live_/sk_live_) in the dashboard, and
      # ALLOW_DEMO_MODE must stay UNSET.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Platform operators allowed to provision new orgs and see every client
      # (comma-separated emails).
      - key: PLATFORM_ADMIN_EMAILS
        sync: false

      # ── Secrets at rest (AES-256-GCM key for stored OAuth tokens etc.) ─────
      - key: PLATFORM_ENCRYPTION_KEY
        sync: false

      # ── Automation ──────────────────────────────────────────────────────────
      # Scheduler endpoint token (omit to disable the hourly sweep).
      - key: CRON_SECRET
        sync: false
      # Inbound integration webhook (/api/platform/hooks) fallback signing
      # secret; per-org secrets in the registry settings take precedence.
      - key: PLATFORM_WEBHOOK_SECRET
        sync: false
      # Outbound-event feed for the n8n delivery worker (GET/POST
      # /api/platform/outbox); falls back to PLATFORM_WEBHOOK_SECRET.
      - key: OUTBOX_FEED_SECRET
        sync: false

      # ── Module 2 inbox ingestion (live IMAP mailbox; omit all for fixtures) ─
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_MAILBOX
        sync: false
      - key: IMAP_TLS
        sync: false

      # ── Google Drive document storage (omit all three for local storage) ───
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false

      # ── Xero read integration (Custom Connection; omit for demo ledger) ────
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false

      # ── Google APIs (UC1 only — omit if only deploying UC2/UC3) ───────────
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_SOLAR_API_KEY
        sync: false

      # ── Geoscape (UC1 only) ────────────────────────────────────────────────
      - key: GEOSCAPE_CONSUMER_KEY
        sync: false

      # ── Runtime ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
